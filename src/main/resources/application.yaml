server:
  port: ${PORT:8081}

spring:
  application:
    name: worknote

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55916/worknote}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tokyo


  servlet:
    multipart:
      max-file-size: ${OCR_MAX_FILE_SIZE:4MB}
      max-request-size: ${OCR_MAX_REQUEST_SIZE:4MB}

  docker:
    compose:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5:3b}
  api-key: ${OLLAMA_API_KEY:}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}


ocr:
  max-file-size-bytes: ${OCR_MAX_FILE_SIZE_BYTES:4194304}
  max-recognized-text-chars: ${OCR_MAX_RECOGNIZED_TEXT_CHARS:20000}
  azure:
    endpoint: ${OCR_AZURE_ENDPOINT:}
    api-key: ${OCR_AZURE_API_KEY:}
    api-version: ${OCR_AZURE_API_VERSION:2024-11-30}
    model-id: ${OCR_AZURE_MODEL_ID:prebuilt-read}
    timeout-seconds: ${OCR_AZURE_TIMEOUT_SECONDS:60}
    poll-interval-millis: ${OCR_AZURE_POLL_INTERVAL_MILLIS:1000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  usage-limits:
    ai-per-user-per-day: ${AI_DAILY_LIMIT:20}
    azure-ocr-per-user-per-day: ${AZURE_OCR_DAILY_LIMIT:5}

report:
  pdf:
    korean-font-path: ${REPORT_PDF_KOREAN_FONT_PATH:classpath:fonts/NanumGothic.ttf}
    japanese-font-path: ${REPORT_PDF_JAPANESE_FONT_PATH:classpath:fonts/ipaexg.ttf}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    display-request-duration: true
    persist-authorization: true
    filter: true
